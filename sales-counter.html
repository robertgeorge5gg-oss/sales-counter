<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Sales Counter</title>
<style>
  :root{
    --bg:#f4f2ed; --card:#fff; --ink:#1d2421; --muted:#6b736f; --line:#e3e0d8;
    --brand:#1f6f5c; --brand-ink:#fff; --warn:#b5462f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
  header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 14px 14px}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:18px;margin:0;font-weight:650}
  .seller{font-size:12px;opacity:.85;margin-top:2px}
  .sync{font-size:12px;margin-top:3px;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#9fb;display:inline-block}
  .dot.wait{background:#ffd36b}.dot.err{background:#ff8f7a}.dot.off{background:rgba(255,255,255,.4)}
  .hbtns{display:flex;gap:6px}
  .menu-btn{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px}
  .totals{display:flex;gap:10px;margin-top:12px}
  .tot{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
  .tot .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
  .tot .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  main{padding:12px}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.5}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-size:17px;font-weight:650;word-break:break-word}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .edit{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px;text-decoration:underline}
  .controls{display:flex;align-items:center;gap:10px;margin-top:10px}
  .sell{flex:1;height:56px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:18px;font-weight:700}
  .sell:active{transform:scale(.98);filter:brightness(.92)}
  .count{min-width:64px;text-align:center}
  .count .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .count .l{font-size:11px;color:var(--muted)}
  .undo{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#faf9f6;font-size:20px;color:var(--warn)}
  .undo:disabled{opacity:.35}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:13px}
  .chip{background:#f1efe9;border-radius:8px;padding:5px 8px}
  .chip b{font-variant-numeric:tabular-nums}
  .chip.low{background:#fbefd6;color:#7a520a}
  .chip.out{background:#f8ddd6;color:var(--warn)}
  .fab{position:fixed;right:18px;bottom:22px;width:62px;height:62px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:34px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10;align-items:flex-end}
  .sheet-bg.open{display:flex}
  .sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:90vh;overflow:auto}
  .sheet h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7}
  input:focus{outline:2px solid var(--brand);border-color:transparent}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600}
  .btn.primary{background:var(--brand);color:#fff;border:0}
  .btn.danger{color:var(--warn)}
  .list-btn{display:block;width:100%;text-align:left;padding:14px 12px;font-size:16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink)}
  .list-btn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .list-btn.danger{color:var(--warn)}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1d2421;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="toprow">
    <div>
      <h1>Sales Counter</h1>
      <div class="seller" id="sellerLabel"></div>
      <div class="sync" id="syncLabel"></div>
    </div>
    <div class="hbtns">
      <button class="menu-btn" id="refreshBtn" aria-label="Refresh" style="display:none">⟳</button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
  </div>
  <div class="totals">
    <div class="tot"><div class="lbl" id="qtyLbl">Items sold</div><div class="val" id="totQty">0</div></div>
    <div class="tot"><div class="lbl">Amount</div><div class="val" id="totAmt">₹0</div></div>
  </div>
</header>

<main id="list"></main>

<button class="fab" id="addBtn" aria-label="Add item">+</button>

<!-- Add / edit item -->
<div class="sheet-bg" id="itemSheet">
  <div class="sheet">
    <h2 id="itemTitle">Add item</h2>
    <label for="fName">Item name</label>
    <input id="fName" placeholder="e.g. Notebook">
    <div class="row">
      <div>
        <label for="fStock">Stock (max)</label>
        <input id="fStock" type="number" inputmode="numeric" min="0" placeholder="e.g. 75">
      </div>
      <div>
        <label for="fPrice">Selling price ₹</label>
        <input id="fPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 40">
      </div>
    </div>
    <div class="hint">Leave stock empty if you don't want to track it.</div>
    <div id="editExtra" style="display:none">
      <label for="fSold" id="fSoldLbl">Sold so far</label>
      <input id="fSold" type="number" inputmode="numeric" min="0">
    </div>
    <div class="actions">
      <button class="btn danger" id="delBtn" style="display:none">Delete</button>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Shared sheet setup -->
<div class="sheet-bg" id="syncSheet">
  <div class="sheet">
    <h2>Shared Google Sheet</h2>
    <label for="sUrl">Web app URL</label>
    <input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
    <label for="sKey">Key</label>
    <input id="sKey" placeholder="Same key as in the script" autocapitalize="off" autocorrect="off">
    <div class="hint">When connected, everyone using this URL sees the same items and the combined sales. Sales made without internet are kept on the phone and sent automatically later.</div>
    <div class="actions">
      <button class="btn danger" id="sDisconnect">Disconnect</button>
      <button class="btn" id="sCancel">Cancel</button>
      <button class="btn primary" id="sConnect">Connect</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div class="sheet-bg" id="menuSheet">
  <div class="sheet">
    <h2>Menu</h2>
    <button class="list-btn" id="mSeller">Set seller name<small>Recorded with every sale so you can tell sellers apart</small></button>
    <button class="list-btn" id="mSync">Shared Google Sheet<small id="mSyncSub">Not connected – data stays on this phone</small></button>
    <button class="list-btn" id="mExport">Export summary (Excel / CSV)<small>One row per item: sold, stock left, amount</small></button>
    <button class="list-btn" id="mExportLog">Export my sales log (Excel / CSV)<small>Every sale made on this phone, with date and time</small></button>
    <button class="list-btn" id="mBackup">Backup all data<small>Saves a file you can restore later or on another phone</small></button>
    <button class="list-btn" id="mRestore">Restore from backup</button>
    <button class="list-btn danger" id="mResetCounts">Reset sales to zero<small>This phone only. Keeps items and prices.</small></button>
    <button class="list-btn danger" id="mClear">Delete everything on this phone</button>
    <div class="actions"><button class="btn" id="menuClose">Close</button></div>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY = 'salesCounter.v1';
  // items: shown list. log: sales made on THIS phone. pending: events not yet sent to the sheet.
  // server: last data received from the sheet. sync: {url,key} or null.
  let state = { seller:'', items:[], log:[], pending:[], server:null, sync:null, lastSync:null };
  let editingId = null, syncStatus = 'off', syncBusy = false, flushTimer = null;

  // ---------- storage ----------
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const s = JSON.parse(raw);
        if(s && Array.isArray(s.items)) state = Object.assign(state, s);
      }
    }catch(e){}
    state.log.forEach(r => { r.eventId = r.eventId || r.id; r.type = 'sale'; });
    state.pending = state.pending || [];
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('Could not save – make a backup'); }
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const rupee = n => '₹' + (Math.round(n*100)/100).toLocaleString('en-IN', {maximumFractionDigits:2});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
  const syncOn = () => !!(state.sync && state.sync.url);
  function left(it){ return it.stock==null ? null : it.stock - it.sold; }
  function pad(n){ return String(n).padStart(2,'0'); }
  function stamp(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
  function fileStamp(){ const d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes()); }
  function safeName(){ return (state.seller||'seller').replace(/[^a-z0-9_-]+/gi,'_'); }
  function mine(itemId){ return state.log.reduce((s,r)=> s + (r.itemId===itemId ? r.qty : 0), 0); }

  // ---------- events (the same in local and shared mode) ----------
  function applyTo(items, ev){
    if(ev.type==='item_upsert'){
      const it = items.find(x=>x.id===ev.item.id);
      if(it) Object.assign(it, ev.item); else items.push(Object.assign({sold:0, amount:0}, ev.item));
    } else if(ev.type==='item_delete'){
      const i = items.findIndex(x=>x.id===ev.itemId); if(i>=0) items.splice(i,1);
    } else if(ev.type==='sale'){
      const it = items.find(x=>x.id===ev.itemId);
      if(it){ it.sold += ev.qty; it.amount = Math.round((it.amount + ev.qty*ev.price)*100)/100; }
    }
  }
  function dispatch(ev){
    ev.eventId = ev.eventId || uid();
    ev.seller = state.seller || '';
    applyTo(state.items, ev);
    if(ev.type==='sale') state.log.push(ev);
    if(syncOn()){ state.pending.push(ev); scheduleFlush(); }
    save(); render();
  }
  // rebuild the visible list = sheet data + anything still waiting to be sent
  function rebuild(){
    if(!syncOn() || !state.server) return;
    const items = state.server.items.map(i => Object.assign({}, i));
    state.pending.forEach(ev => applyTo(items, ev));
    state.items = items;
  }

  // ---------- talking to the Google Sheet ----------
  function setStatus(s){ syncStatus = s; renderSync(); }
  async function call(method, events){
    const url = state.sync.url;
    let res;
    if(method==='GET'){
      res = await fetch(url + (url.includes('?')?'&':'?') + 'key=' + encodeURIComponent(state.sync.key||'') + '&t=' + Date.now());
    } else {
      res = await fetch(url, { method:'POST', body: JSON.stringify({ key: state.sync.key||'', events }) });
    }
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Sheet refused the request');
    return data;
  }
  async function syncNow(){
    if(!syncOn() || syncBusy) return;
    if(navigator.onLine===false){ setStatus('offline'); return; }
    syncBusy = true; setStatus('busy');
    try{
      let data;
      if(state.pending.length){
        const batch = state.pending.slice(0, 50);
        data = await call('POST', batch);
        const done = new Set(data.done || []);
        state.pending = state.pending.filter(e => !done.has(e.eventId));
      } else {
        data = await call('GET');
      }
      state.server = { items: data.items };
      state.lastSync = Date.now();
      rebuild(); save(); render();
      setStatus('ok');
      if(state.pending.length){ syncBusy=false; return syncNow(); }
    }catch(e){
      setStatus(e && /key|refused/i.test(e.message) ? 'err:'+e.message : 'offline');
    }finally{ syncBusy = false; }
  }
  function scheduleFlush(){ clearTimeout(flushTimer); flushTimer = setTimeout(syncNow, 700); }
  setInterval(() => { if(document.visibilityState==='visible') syncNow(); }, 20000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') syncNow(); });
  window.addEventListener('online', syncNow);

  // ---------- render ----------
  function renderSync(){
    const lbl = $('syncLabel');
    $('refreshBtn').style.display = syncOn() ? 'block' : 'none';
    $('qtyLbl').textContent = syncOn() ? 'Sold (everyone)' : 'Items sold';
    $('mSyncSub').textContent = syncOn() ? 'Connected – tap to change' : 'Not connected – data stays on this phone';
    if(!syncOn()){ lbl.innerHTML = ''; return; }
    const n = state.pending.length;
    const t = state.lastSync ? new Date(state.lastSync) : null;
    const when = t ? pad(t.getHours())+':'+pad(t.getMinutes()) : 'never';
    let dot='ok', txt='Synced '+when;
    if(syncStatus==='busy'){ dot='wait'; txt='Syncing…'; }
    else if(syncStatus==='offline'){ dot='wait'; txt='Offline'+(n?' – '+n+' waiting':'')+' · last '+when; }
    else if(syncStatus.startsWith('err:')){ dot='err'; txt=syncStatus.slice(4); }
    else if(n){ dot='wait'; txt=n+' waiting to sync'; }
    lbl.innerHTML = '<span class="dot '+(dot==='ok'?'':dot)+'"></span>'+esc(txt);
  }
  function render(){
    $('sellerLabel').textContent = state.seller ? 'Seller: ' + state.seller : 'Tap ☰ to set your name';
    let q=0, a=0;
    state.items.forEach(it => { q += it.sold; a += it.amount; });
    $('totQty').textContent = q;
    $('totAmt').textContent = rupee(a);
    renderSync();

    const list = $('list');
    if(!state.items.length){
      list.innerHTML = '<div class="empty">No items yet.<br>Tap <b>+</b> to add your first item.</div>';
      return;
    }
    list.innerHTML = state.items.map(it => {
      const l = left(it), me = mine(it.id);
      let stockChip = '';
      if(l!=null){
        const cls = l<=0 ? 'out' : (l <= Math.max(3, Math.ceil(it.stock*0.1)) ? 'low' : '');
        stockChip = `<span class="chip ${cls}">Left: <b>${l}</b> / ${it.stock}</span>`;
      }
      const meChip = syncOn() ? `<span class="chip">By me: <b>${me}</b></span>` : '';
      return `<div class="item" data-id="${esc(it.id)}">
        <div class="item-head">
          <div>
            <div class="name">${esc(it.name)}</div>
            <div class="meta">${it.price ? rupee(it.price)+' each' : 'No price set'}</div>
          </div>
          <button class="edit" data-act="edit">Edit</button>
        </div>
        <div class="controls">
          <button class="sell" data-act="sell">Sold +1</button>
          <div class="count"><div class="n">${it.sold}</div><div class="l">sold</div></div>
          <button class="undo" data-act="undo" ${(syncOn()? me>0 : it.sold>0)?'':'disabled'} aria-label="Undo last sale">↶</button>
        </div>
        <div class="stats">${stockChip}${meChip}<span class="chip">Amount: <b>${rupee(it.amount)}</b></span></div>
      </div>`;
    }).join('');
  }

  // ---------- selling ----------
  function sell(it){
    const l = left(it);
    if(l!=null && l<=0 && !confirm('Stock for "'+it.name+'" is 0. Record a sale anyway?')) return;
    dispatch({ type:'sale', itemId:it.id, item:it.name, price:it.price||0, qty:1, time:stamp(new Date()) });
    if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  }
  function undo(it){
    // find this phone's most recent plain sale of the item
    let idx = -1;
    for(let i=state.log.length-1;i>=0;i--){ const r=state.log[i]; if(r.itemId===it.id && r.qty===1 && !r.note){ idx=i; break; } }
    const entry = idx>=0 ? state.log[idx] : null;
    const pIdx = entry && syncOn() ? state.pending.findIndex(e=>e.eventId===entry.eventId) : -1;
    if(entry && (!syncOn() || pIdx>=0)){
      // not yet sent (or local mode): just take it back
      state.log.splice(idx,1);
      if(syncOn()){ state.pending.splice(pIdx,1); rebuild(); }
      else applyTo(state.items, Object.assign({}, entry, {qty:-1}));
      save(); render();
    } else {
      // already in the sheet: record a minus-one so the history stays honest
      dispatch({ type:'sale', itemId:it.id, item:it.name, price: entry ? entry.price : (it.price||0), qty:-1, time:stamp(new Date()), note:'undo' });
    }
    toast('Undone: '+it.name);
  }

  $('list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]'); if(!btn) return;
    const id = btn.closest('.item').dataset.id;
    const it = state.items.find(x=>x.id===id); if(!it) return;
    const act = btn.dataset.act;
    if(act==='sell') sell(it);
    else if(act==='undo') undo(it);
    else if(act==='edit') openItem(it);
  });

  // ---------- item sheet ----------
  function openItem(it){
    editingId = it ? it.id : null;
    $('itemTitle').textContent = it ? 'Edit item' : 'Add item';
    $('fName').value = it ? it.name : '';
    $('fStock').value = it && it.stock!=null ? it.stock : '';
    $('fPrice').value = it && it.price ? it.price : '';
    $('fSoldLbl').textContent = syncOn() ? 'Sold by me' : 'Sold so far';
    $('fSold').value = it ? (syncOn() ? mine(it.id) : it.sold) : '';
    $('editExtra').style.display = it ? 'block' : 'none';
    $('delBtn').style.display = it ? 'block' : 'none';
    $('itemSheet').classList.add('open');
    setTimeout(()=>{ if(!it) $('fName').focus(); }, 150);
  }
  function closeItem(){ $('itemSheet').classList.remove('open'); editingId=null; }

  $('addBtn').onclick = () => openItem(null);
  $('cancelBtn').onclick = closeItem;
  $('saveBtn').onclick = () => {
    const name = $('fName').value.trim();
    if(!name){ toast('Enter an item name'); $('fName').focus(); return; }
    const sRaw = $('fStock').value.trim();
    const stock = sRaw==='' ? null : Math.max(0, parseInt(sRaw,10)||0);
    const price = Math.max(0, parseFloat($('fPrice').value)||0);
    if(editingId){
      const it = state.items.find(x=>x.id===editingId);
      const before = syncOn() ? mine(it.id) : it.sold;
      dispatch({ type:'item_upsert', item:{ id:it.id, name, stock, price } });
      state.log.forEach(r => { if(r.itemId===it.id) r.item = name; });
      const sv = $('fSold').value.trim();
      const target = sv==='' ? before : Math.max(0, parseInt(sv,10)||0);
      if(target !== before){
        dispatch({ type:'sale', itemId:it.id, item:name, price, qty: target-before, time:stamp(new Date()), note:'manual correction' });
      }
    } else {
      dispatch({ type:'item_upsert', item:{ id:uid(), name, stock, price } });
    }
    save(); render(); closeItem();
  };
  $('delBtn').onclick = () => {
    const it = state.items.find(x=>x.id===editingId);
    const msg = syncOn() ? 'Delete "'+it.name+'" for EVERYONE on the shared sheet? (Its sales stay in the Sales Log.)' : 'Delete "'+it.name+'" and its sales?';
    if(it && confirm(msg)){
      dispatch({ type:'item_delete', itemId:it.id });
      if(!syncOn()) state.log = state.log.filter(r=>r.itemId!==it.id);
      save(); render(); closeItem();
    }
  };

  // ---------- shared sheet setup ----------
  const syncSheet = $('syncSheet');
  $('mSync').onclick = () => {
    $('sUrl').value = state.sync ? state.sync.url : '';
    $('sKey').value = state.sync ? state.sync.key : '';
    $('sDisconnect').style.display = syncOn() ? 'block' : 'none';
    menu.classList.remove('open'); syncSheet.classList.add('open');
  };
  $('sCancel').onclick = () => syncSheet.classList.remove('open');
  $('sDisconnect').onclick = () => {
    if(state.pending.length && !confirm(state.pending.length+' changes have not reached the sheet yet. Disconnect anyway? (They stay on this phone.)')) return;
    state.sync = null; state.server = null; state.pending = [];
    save(); render(); syncSheet.classList.remove('open'); toast('Disconnected – working on this phone only');
  };
  $('sConnect').onclick = async () => {
    const url = $('sUrl').value.trim(), key = $('sKey').value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('Paste the Web app URL from Apps Script'); return; }
    if(!state.seller){ const v = prompt('Your seller name first:', ''); if(!v) return; state.seller = v.trim(); }
    const prev = state.sync; state.sync = { url, key };
    setStatus('busy');
    let data;
    try{ data = await call('GET'); }
    catch(e){ state.sync = prev; setStatus('off'); render(); toast('Could not connect: '+(e.message||'check URL and internet')); return; }
    // offer to upload what is already on this phone
    const onServer = new Set(data.items.map(i=>i.id));
    const newItems = state.items.filter(i => !onServer.has(i.id));
    const queued = [];
    if(newItems.length && confirm('Add this phone\'s '+newItems.length+' item(s) to the shared sheet?')){
      newItems.forEach(i => queued.push({ type:'item_upsert', eventId:uid(), seller:state.seller, item:{ id:i.id, name:i.name, stock:i.stock, price:i.price } }));
      if(state.log.length && confirm('Also send the '+state.log.length+' sale(s) recorded on this phone?')){
        state.log.forEach(r => queued.push(Object.assign({}, r, {type:'sale', seller: state.seller})));
      } else {
        state.log = state.log.filter(r => onServer.has(r.itemId));
      }
    } else {
      state.log = state.log.filter(r => onServer.has(r.itemId));
    }
    state.pending = queued;
    state.server = { items: data.items };
    rebuild(); save(); render();
    syncSheet.classList.remove('open');
    toast('Connected to shared sheet');
    syncNow();
  };
  $('refreshBtn').onclick = () => syncNow();

  // ---------- menu ----------
  const menu = $('menuSheet');
  $('menuBtn').onclick = () => menu.classList.add('open');
  $('menuClose').onclick = () => menu.classList.remove('open');
  [menu, $('itemSheet'), syncSheet].forEach(bg => bg.addEventListener('click', e => { if(e.target===bg){ bg.classList.remove('open'); editingId=null; } }));

  $('mSeller').onclick = () => {
    const v = prompt('Your name (recorded with each sale):', state.seller||'');
    if(v!==null){ state.seller = v.trim(); save(); render(); }
  };

  function csvCell(v){ v = v==null ? '' : String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  function download(name, text, type){
    const blob = new Blob([text], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Saved to Downloads');
  }
  function exportCSV(name, rows){
    download(name, '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  }
  $('mExport').onclick = () => {
    const now = stamp(new Date());
    const rows = [['Seller','Exported At','Item','Price','Starting Stock','Sold','Stock Left','Amount (Rs)']];
    state.items.forEach(it => rows.push([syncOn()?'ALL (shared sheet)':state.seller, now, it.name, it.price, it.stock==null?'':it.stock, it.sold, left(it)==null?'':left(it), Math.round(it.amount*100)/100]));
    exportCSV('summary_'+safeName()+'_'+fileStamp()+'.csv', rows);
  };
  $('mExportLog').onclick = () => {
    const rows = [['Seller','Date Time','Item','Qty','Price','Amount (Rs)','Note']];
    state.log.forEach(r => rows.push([r.seller||state.seller, r.time, r.item, r.qty, r.price, Math.round(r.qty*r.price*100)/100, r.note||'']));
    exportCSV('saleslog_'+safeName()+'_'+fileStamp()+'.csv', rows);
  };
  $('mBackup').onclick = () => download('backup_'+safeName()+'_'+fileStamp()+'.json', JSON.stringify(state,null,1), 'application/json');
  $('mRestore').onclick = () => $('restoreFile').click();
  $('restoreFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const s = JSON.parse(r.result);
        if(!s || !Array.isArray(s.items)) throw 0;
        if(confirm('Replace current data with this backup?')){
          state = Object.assign({ seller:'', items:[], log:[], pending:[], server:null, sync:null, lastSync:null }, s);
          state.log.forEach(r => { r.eventId = r.eventId || r.id; r.type = 'sale'; });
          state.pending = state.pending || [];
          save(); render(); toast('Restored'); menu.classList.remove('open'); syncNow();
        }
      }catch(err){ toast('Not a valid backup file'); }
      e.target.value='';
    };
    r.readAsText(f);
  };
  $('mResetCounts').onclick = () => {
    if(syncOn()){ toast('Connected to the shared sheet – clear the Sales Log tab in Google Sheets instead'); return; }
    if(confirm('Set all sold counts to zero and clear the sales log? (Export first if you need it.)')){
      state.items.forEach(it => { it.sold=0; it.amount=0; });
      state.log = []; save(); render(); menu.classList.remove('open');
    }
  };
  $('mClear').onclick = () => {
    if(confirm('Delete ALL items and sales on this phone? (The shared sheet is not touched.) This cannot be undone.')){
      state = { seller: state.seller, items:[], log:[], pending:[], server:null, sync:null, lastSync:null };
      save(); render(); menu.classList.remove('open');
    }
  };

  load(); rebuild(); render(); syncNow();
})();
</script>
</body>
</html>
